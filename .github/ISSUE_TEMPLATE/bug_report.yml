name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste a lockfile, a session payload, or anything
        containing an `rso_auth.authorization-key`. See SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the route or API you called, and what came back.
    validations: { required: true }

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: { required: true }

  - type: input
    id: version
    attributes:
      label: ritoclient-api version
      placeholder: "0.1.0, or a git rev"
    validations: { required: true }

  - type: input
    id: client
    attributes:
      label: Riot Client state
      description: >
        Running, tray-idle, or closed - and which product was installed. Most
        surprises here turn out to be state-dependent.
    validations: { required: true }

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        `tracing` output if you have it. Redact anything that looks like a
        credential.
      render: text
