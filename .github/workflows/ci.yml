name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is what this actually runs on. Linux is here to keep the
        # non-Windows fallbacks in `processes`, `spawn` and `window` compiling -
        # they are the reason the crate builds off Windows at all.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --all-targets
      # `--all-targets` skips doctests, and most of this crate's worked examples
      # are doctests.
      - run: cargo test --workspace --all-features --doc

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  docs:
    name: Docs
    runs-on: windows-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Windows so the platform-gated items are documented, matching the
      # `docs.rs` default target set in the crate manifest.
      - run: cargo doc --workspace --no-deps --all-features

  codegen:
    name: Codegen Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@v2
      # `ritoclient-api` is generator output. Regenerating from the checked-in
      # snapshot must be a no-op; a diff means a generated file was hand-edited
      # or the generator changed without its output being committed.
      - run: cargo xtask ritoclient-codegen
      - run: git diff --exit-code

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ steps.msrv.outputs.version }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets

  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches a missing README, an unbuildable package, or a file that only
      # resolves inside the workspace - all of which otherwise surface at the
      # moment of release. `package --workspace` rather than per-crate
      # `publish --dry-run` because the three crates depend on each other with
      # `=` pins that only exist on crates.io after a real release.
      - run: cargo package --workspace --all-features
