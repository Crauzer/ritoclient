[workspace]
members = [
    "crates/ritoclient-core",
    "crates/ritoclient-api",
    "crates/ritoclient",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Crauzer/ritoclient"
authors = ["Crauzer"]

[workspace.dependencies]
ritoclient-core = { version = "=0.1.0", path = "crates/ritoclient-core" }
ritoclient-api = { version = "=0.1.0", path = "crates/ritoclient-api" }

reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ts-rs = "12"
windows-sys = "0.59"

assert_matches = "1.5"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
