[package]
name = "ritoclient"
description = "Client for the Riot Client's local API - discovery, launching, and the product registry"
keywords = ["riot", "league-of-legends", "valorant", "launcher"]
categories = ["api-bindings", "games"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["launcher"]
# The launch/session orchestration and its Win32 half. Off, this crate is the
# typed API surface plus the on-disk records, with no windows-sys of its own.
launcher = ["dep:windows-sys"]

[dependencies]
ritoclient-core = { workspace = true }
ritoclient-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_matches = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[example]]
name = "launch"
required-features = ["launcher"]

[[example]]
name = "probe"
required-features = ["launcher"]

# Launching is Windows-only, so the default Linux docs.rs target would hide it.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-unknown-linux-gnu"]
