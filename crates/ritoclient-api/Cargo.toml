# The one hand-written file in this crate, and it is the allowlist rather than
# an exception to it: generated code cannot reach a launcher type, a sleep, or
# Win32, because no dependency here provides one.

[package]
name = "ritoclient-api"
description = "Typed namespaces and models for the Riot Client's local API"
keywords = ["riot", "league-of-legends", "valorant", "launcher"]
categories = ["api-bindings", "games"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ritoclient-core = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-unknown-linux-gnu"]
